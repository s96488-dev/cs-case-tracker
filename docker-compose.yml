# Cloud: collector + Caddy (HTTPS with an automatic Let's Encrypt certificate).
# Create a .env file next to it before starting (see .env.example).
services:
  collector:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - collector
volumes:
  caddy_data:
