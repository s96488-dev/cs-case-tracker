<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS2 Case Tracker</title>
<!-- Lightweight chart page served by the home backend. -->
<style>
  :root { --bg:#0f1115; --panel:#171a21; --text:#e6e6e6; --muted:#8a8f98; --up:#26a69a; --down:#ef5350; --line:#252a33; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px system-ui, sans-serif; background:var(--bg); color:var(--text); display:flex; height:100vh; }
  aside { width:320px; border-right:1px solid var(--line); overflow:auto; background:var(--panel); }
  aside .row { display:flex; gap:8px; align-items:center; padding:8px 12px; cursor:pointer; border-bottom:1px solid var(--line); }
  aside .row:hover, aside .row.active { background:#1f2430; }
  aside img { width:36px; height:28px; object-fit:contain; }
  .name { flex:1; }
  .price { text-align:right; font-variant-numeric:tabular-nums; }
  .chg { font-size:12px; }
  .up { color:var(--up); } .down { color:var(--down); }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  header { padding:12px 16px; display:flex; gap:12px; align-items:center; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; flex:1; }
  #hint { color:var(--muted); font-size:12px; }
  button { background:#232834; color:var(--text); border:1px solid var(--line); padding:4px 10px; border-radius:4px; cursor:pointer; }
  button.on { background:#2962ff; border-color:#2962ff; }
  #tools { padding:6px 16px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; border-bottom:1px solid var(--line); color:var(--muted); font-size:12px; }
  #tools label { display:flex; gap:4px; align-items:center; }
  #tools .grp { display:flex; gap:4px; align-items:center; }
  #tools input[type=number], #tools select { background:#232834; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:3px 4px; font-size:12px; }
  #tools input[type=number] { width:58px; }
  #tools button { padding:3px 8px; font-size:12px; }
  #chart { flex:1; position:relative; }
  /* TradingView-style legend: name, value under the crosshair, eye to hide/show. */
  .legend { position:absolute; left:8px; top:6px; z-index:3; display:flex; flex-direction:column; gap:2px; font-size:12px; }
  .legend .it { display:flex; gap:6px; align-items:center; padding:1px 4px; border-radius:3px; background:rgba(15,17,21,0.6); width:max-content; }
  .legend .it:hover { background:#1f2430; }
  .legend .it.off .nm, .legend .it.off .val { opacity:0.4; text-decoration:line-through; }
  .legend .val { color:var(--text); font-variant-numeric:tabular-nums; min-width:40px; }
  .legend .eye { background:none; border:0; padding:0 2px; cursor:pointer; color:var(--muted); font-size:13px; line-height:1; }
  .legend .eye:hover { color:var(--text); }
  #ratioBox { height:150px; border-top:1px solid var(--line); position:relative; }
  #ratio { position:absolute; inset:0; }
  #ratioLabel { position:absolute; right:92px; top:6px; z-index:2; color:var(--muted); font-size:11px; pointer-events:none; text-align:right; max-width:60%; }
  #status { color:var(--muted); font-size:12px; padding:6px 16px; border-top:1px solid var(--line); }
  #news { width:340px; border-left:1px solid var(--line); overflow:auto; background:var(--panel); }
  #news h2 { font-size:14px; margin:0; padding:8px 8px 8px 12px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; }
  #news h2 span { flex:1; }
  #news.collapsed { width:32px; overflow:hidden; cursor:pointer; }
  #news.collapsed h2 { border:0; padding:8px 4px; flex-direction:column; }
  #news.collapsed h2 span { display:none; }
  #news.collapsed h2::after { content:"News"; writing-mode:vertical-rl; color:var(--muted); font-weight:normal; }
  #news.collapsed #newsList { display:none; }
  #news .item { padding:10px 12px; border-bottom:1px solid var(--line); }
  #news .date { color:var(--muted); font-size:12px; }
  #news a { color:#8ab4ff; text-decoration:none; }
  #news a:hover { text-decoration:underline; }
  #news .text { color:#b8bcc4; font-size:12px; margin-top:4px; white-space:pre-line; max-height:4.5em; overflow:hidden; cursor:pointer; }
  #news .text.open { max-height:none; }
  #news .empty { color:var(--muted); padding:12px; }
</style>
</head>
<body>
<aside id="list"></aside>
<main>
  <header><h1 id="title">Select a case</h1><span id="hint"></span><div id="tfs"></div></header>
  <div id="tools">
    <span class="grp">EV smoothing
      <select id="smType"><option value="">none</option><option value="sma">SMA</option><option value="ema">EMA</option></select>
      <input id="smLen" type="number" min="2" max="365" value="7" title="Period in days"></span>
    <label title="Opening costs case + key: subtract the key price from EV"><input id="keyOn" type="checkbox">minus key $<input id="keyPrice" type="number" min="0" step="0.01" value="2.49"></label>
    <label title="Steam and the game take ~13% of a sale: the seller receives price / 1.15"><input id="feeOn" type="checkbox">minus Steam fee</label>
    <span class="grp">Scale
      <button id="scAuto" title="Auto-scale to visible data (like the A button in TradingView)">Auto</button>
      <button id="scLog" title="Logarithmic scale">Log</button>
      <button id="scPct" title="Percent from the first visible bar: price and EV start from the same point">%</button>
      <button id="scSep" title="EV on its own left scale: both lines use the full height">EV left</button>
      <button id="scFit" title="Show the full history">Full history</button></span>
    <span class="grp">Lower panel
      <select id="lowSel"><option value="ev">Price / EV</option><option value="mkt">Case / market</option></select></span>
  </div>
  <div id="chart"></div>
  <div id="ratioBox"><div id="ratioLabel"></div><div id="ratio"></div></div>
  <div id="status"></div>
</main>
<section id="news"><h2><span>Valve news for this case</span><button id="newsToggle" title="Collapse / expand">»</button></h2><div id="newsList"></div></section>
<script src="lightweight-charts.standalone.production.js"></script>
<script>
const TFS = { "1m": "1", "5m": "5", "15m": "15", "1h": "60", "4h": "240", "1D": "1D" };
let current = null, tf = "60";
const HOURLY = ["60", "240", "1D"];

const chart = LightweightCharts.createChart(document.getElementById("chart"), {
  autoSize: true,
  layout: { background: { color: "#0f1115" }, textColor: "#c7c7c7" },
  grid: { vertLines: { color: "#1c2029" }, horzLines: { color: "#1c2029" } },
  timeScale: { timeVisible: true, secondsVisible: false },
});
const candles = chart.addCandlestickSeries({ upColor: "#26a69a", downColor: "#ef5350", borderVisible: false,
  wickUpColor: "#26a69a", wickDownColor: "#ef5350", priceFormat: { type: "price", precision: 2, minMove: 0.01 } });
const median = chart.addLineSeries({ color: "#f5a623", lineWidth: 2, priceLineVisible: false,
  title: "sales median", priceFormat: { type: "price", precision: 2, minMove: 0.01 } });
const volume = chart.addHistogramSeries({ priceScaleId: "vol", priceFormat: { type: "volume" }, color: "#3a4150",
  title: "sold", priceLineVisible: false });
chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
// EV - expected value of opening: sum of "item price over the last 10 sales x drop probability".
const evLine = chart.addLineSeries({ color: "#4fc3f7", lineWidth: 2, priceLineVisible: false,
  title: "EV", priceFormat: { type: "price", precision: 2, minMove: 0.01 } });
// Vertical line for the active drop pool: a full-height bar on its own hidden scale.
const dropLine = chart.addHistogramSeries({ priceScaleId: "drop", priceLineVisible: false, lastValueVisible: false,
  priceFormat: { type: "volume" } });
chart.priceScale("drop").applyOptions({ scaleMargins: { top: 0.06, bottom: 0 }, visible: false });
// Market index: all cases equally weighted (starts at 100), on its own hidden scale so its shape is comparable with price.
const mktLine = chart.addLineSeries({ priceScaleId: "mkt", color: "#9ccc65", lineWidth: 1, priceLineVisible: false,
  lastValueVisible: false, priceFormat: { type: "price", precision: 1, minMove: 0.1 } });
chart.priceScale("mkt").applyOptions({ scaleMargins: { top: 0.1, bottom: 0.25 }, visible: false });
// Unsmoothed EV as a thin faint line under the smoothed one.
const evRaw = chart.addLineSeries({ color: "rgba(79,195,247,0.35)", lineWidth: 1, priceLineVisible: false,
  lastValueVisible: false, crosshairMarkerVisible: false, priceFormat: { type: "price", precision: 2, minMove: 0.01 } });

// Lower panel: case price (sales median) to EV ratio, time-synced with the main chart.
const ratioChart = LightweightCharts.createChart(document.getElementById("ratio"), {
  autoSize: true,
  layout: { background: { color: "#0f1115" }, textColor: "#c7c7c7" },
  grid: { vertLines: { color: "#1c2029" }, horzLines: { color: "#1c2029" } },
  timeScale: { timeVisible: true, secondsVisible: false, visible: false },
  rightPriceScale: { minimumWidth: 80 }, leftPriceScale: { minimumWidth: 80 },
});
chart.applyOptions({ rightPriceScale: { minimumWidth: 80 } });
const ratioLine = ratioChart.addLineSeries({ color: "#ce93d8", lineWidth: 2, priceLineVisible: false,
  priceFormat: { type: "price", precision: 2, minMove: 0.01 } });
// Empty bars at every time of the main chart: the Lightweight Charts time scale is bar-based, and the two
// panels pan and zoom in sync only when they have the same set of bars.
const ratioTimes = ratioChart.addLineSeries({ lastValueVisible: false, priceLineVisible: false, visible: false });
// Needed so the lower panel has a left scale of the same width as the main chart.
const ratioLeft = ratioChart.addLineSeries({ priceScaleId: "left", lastValueVisible: false, priceLineVisible: false,
  color: "rgba(0,0,0,0)", crosshairMarkerVisible: false });
ratioLine.createPriceLine({ price: 1, color: "#8a8f98", lineStyle: 2, lineWidth: 1, axisLabelVisible: true, title: "" });
// Indicator and scale settings, remembered in the browser.
const opts = { smType: "", smLen: 7, keyOn: false, keyPrice: 2.49, feeOn: false, log: false, pct: false, sep: false,
  low: "ev", hidden: [] };
try { Object.assign(opts, JSON.parse(localStorage.getItem("evOpts") || "{}")); } catch (e) {}
const $ = id => document.getElementById(id);
function saveOpts() { try { localStorage.setItem("evOpts", JSON.stringify(opts)); } catch (e) {} }
function applyScale() {
  const mode = opts.pct ? LightweightCharts.PriceScaleMode.Percentage
    : opts.log ? LightweightCharts.PriceScaleMode.Logarithmic : LightweightCharts.PriceScaleMode.Normal;
  chart.applyOptions({ leftPriceScale: { visible: opts.sep, mode, minimumWidth: 80 }, rightPriceScale: { mode } });
  // In % mode the market index moves to the shared scale: all lines in percent from the same point.
  mktLine.applyOptions({ priceScaleId: opts.pct ? "right" : "mkt" });
  ratioChart.applyOptions({ leftPriceScale: { visible: opts.sep } });
  for (const s of [evLine, evRaw]) s.applyOptions({ priceScaleId: opts.sep ? "left" : "right" });
  $("scLog").classList.toggle("on", opts.log); $("scPct").classList.toggle("on", opts.pct); $("scSep").classList.toggle("on", opts.sep);
}
$("smType").value = opts.smType; $("smLen").value = opts.smLen; $("keyOn").checked = opts.keyOn;
$("keyPrice").value = opts.keyPrice; $("feeOn").checked = opts.feeOn; $("lowSel").value = opts.low;
$("lowSel").onchange = () => { opts.low = $("lowSel").value; saveOpts(); renderEv(); };
for (const id of ["smType", "smLen", "keyOn", "keyPrice", "feeOn"]) $(id).onchange = () => {
  opts.smType = $("smType").value; opts.smLen = Math.max(2, parseInt($("smLen").value) || 7);
  opts.keyOn = $("keyOn").checked; opts.keyPrice = parseFloat($("keyPrice").value) || 0; opts.feeOn = $("feeOn").checked;
  saveOpts(); renderEv();
};
$("scLog").onclick = () => { opts.log = !opts.log; opts.pct = false; saveOpts(); applyScale(); };
$("scPct").onclick = () => { opts.pct = !opts.pct; opts.log = false; saveOpts(); applyScale(); };
$("scSep").onclick = () => { opts.sep = !opts.sep; saveOpts(); applyScale(); };
$("scAuto").onclick = () => { for (const id of ["left", "right"]) chart.priceScale(id).applyOptions({ autoScale: true });
  ratioChart.priceScale("right").applyOptions({ autoScale: true }); };
$("scFit").onclick = () => chart.timeScale().fitContent();
applyScale();

function smooth(data) {
  const n = opts.smLen;
  if (!opts.smType || data.length < 2) return data;
  if (opts.smType === "ema") {
    const k = 2 / (n + 1); let prev = null;
    return data.map(d => ({ time: d.time, value: prev = prev === null ? d.value : prev + k * (d.value - prev) }));
  }
  let sum = 0;
  return data.map((d, i) => { sum += d.value; if (i >= n) sum -= data[i - n].value;
    return { time: d.time, value: sum / Math.min(i + 1, n) }; });
}

function setLow(data, name) {
  ratioLine.setData(data);
  ratioAt = new Map(data.map(d => [d.time, d.value]));
  if (typeof lowLegend !== "undefined") { lowLegend[0].row.querySelector(".nm").textContent = name; updateLegend(lowLegend); }
}
// Last loaded data: indicator settings changes re-render without new requests.
let evData = [], hist = [], mktData = [];
function renderEv() {
  const fee = opts.feeOn ? 1 / 1.15 : 1, key = opts.keyOn ? opts.keyPrice : 0;
  const raw = evData.map(e => ({ time: e.time, value: e.ev }));
  const sm = smooth(raw);
  evLine.setData(sm.map(d => ({ time: d.time, value: d.value * fee - key })));
  evRaw.setData(opts.smType ? raw.map(d => ({ time: d.time, value: d.value * fee - key })) : []);
  evLine.applyOptions({ title: "EV" + (opts.smType ? ` ${opts.smType.toUpperCase()} ${opts.smLen}` : "")
    + (key ? " - key" : "") + (fee < 1 ? " - fee" : "") });
  // Ratio: cost of opening (case + key, if enabled) to the average drop value (after the fee).
  const lastEv = evData[evData.length - 1];
  if (opts.low === "mkt") {
    // Case strength vs the market: case price / market index, 1 at the start of history. Rising - the case beats the market.
    const idx = new Map(mktData.map(d => [d.time, d.value]));
    const pts = hist.filter(h => h.median !== null && idx.get(Math.floor(h.time / 86400) * 86400))
      .map(h => ({ time: h.time, value: h.median / idx.get(Math.floor(h.time / 86400) * 86400) }));
    const base = pts.length ? pts[0].value : 1;
    setLow(pts.map(p => ({ time: p.time, value: p.value / base })), "Case / market");
    $("ratioLabel").textContent = "Case / market index (1 = start of history): rising - case beats the market, falling - lags it";
    return;
  }
  const evByDay = new Map(sm.map(d => [d.time, d.value * fee]));
  const evAt = t => evByDay.get(Math.floor(t / 86400) * 86400);
  const what = key ? "(case + key) / EV" : "Price / EV";
  setLow(hist.filter(h => h.median !== null && evAt(h.time))
    .map(h => ({ time: h.time, value: (h.median + key) / evAt(h.time) })), what);
  $("ratioLabel").textContent = lastEv
    ? `${what}${fee < 1 ? " after fee" : ""}. EV now $${lastEv.ev.toFixed(2)}, ${(lastEv.coverage * 100).toFixed(0)}% of probability priced. `
      + (key ? "Below 1 - opening pays off on average" : "Above 1 - the case costs more than its average drop")
    : "Price / EV: EV for this case is not computed yet (the cloud collects item prices case by case)";
}

let medianAt = new Map(), ratioAt = new Map();
// Panel sync: same set of bars (ratioTimes) + shared logical range and crosshair.
let syncing = false;
function linkRange(from, to) {
  from.timeScale().subscribeVisibleLogicalRangeChange(r => {
    if (!r || syncing) return;
    syncing = true;
    try { to.timeScale().setVisibleLogicalRange(r); } catch (e) {}
    syncing = false;
  });
}
linkRange(chart, ratioChart); linkRange(ratioChart, chart);
function syncTimes() {
  const all = new Set();
  for (const s of [candles, median, volume, evLine, evRaw, dropLine, mktLine])
    for (let i = 0, d = s.data(); i < d.length; i++) all.add(d[i].time);
  ratioTimes.setData([...all].sort((a, b) => a - b).map(time => ({ time })));
  medianAt = new Map(median.data().map(d => [d.time, d.value]));
  const r = chart.timeScale().getVisibleLogicalRange();
  if (r) ratioChart.timeScale().setVisibleLogicalRange(r);
}
chart.subscribeCrosshairMove(p => {
  updateLegend(mainLegend, p);
  if (syncing) return;
  syncing = true;
  if (p.time !== undefined) {
    const v = ratioAt.get(p.time);
    if (v !== undefined) ratioChart.setCrosshairPosition(v, p.time, ratioLine); else ratioChart.clearCrosshairPosition();
  } else ratioChart.clearCrosshairPosition();
  syncing = false;
});
ratioChart.subscribeCrosshairMove(p => {
  updateLegend(lowLegend, p);
  if (syncing) return;
  syncing = true;
  const v = p.time !== undefined ? medianAt.get(p.time) : undefined;
  if (v !== undefined) chart.setCrosshairPosition(v, p.time, median); else chart.clearCrosshairPosition();
  syncing = false;
});

// Legend: each row controls one or more series; hidden ones are remembered.
function makeLegend(box, entries) {
  const el = document.createElement("div");
  el.className = "legend";
  box.appendChild(el);
  for (const e of entries) {
    const row = document.createElement("div");
    row.className = "it";
    row.innerHTML = '<span class="nm"></span><span class="val"></span><button class="eye" title="Hide / show">👁</button>';
    row.querySelector(".nm").textContent = e.name;
    row.querySelector(".nm").style.color = e.color;
    const apply = () => {
      const off = opts.hidden.includes(e.key);
      row.classList.toggle("off", off);
      for (const s of e.series) s.applyOptions({ visible: !off });
      if (e.onToggle) e.onToggle(off);
    };
    row.querySelector(".eye").onclick = () => {
      opts.hidden = opts.hidden.includes(e.key) ? opts.hidden.filter(k => k !== e.key) : [...opts.hidden, e.key];
      saveOpts(); apply();
    };
    e.row = row; e.val = row.querySelector(".val");
    el.appendChild(row); apply();
  }
  return entries;
}
function fmt(v, digits) { return v === undefined || v === null || isNaN(v) ? "" : v.toFixed(digits); }
function updateLegend(entries, p) {
  for (const e of entries) {
    const s = e.series[0];
    let d = p && p.time !== undefined ? p.seriesData.get(s) : undefined;
    if (!d) { const all = s.data(); for (let i = all.length - 1; i >= 0; i--) if (all[i].value !== undefined || all[i].close !== undefined) { d = all[i]; break; } }
    e.val.textContent = !d ? "" : d.close !== undefined
      ? `${fmt(d.open, 2)} ${fmt(d.high, 2)} ${fmt(d.low, 2)} ${fmt(d.close, 2)}` : fmt(d.value, e.digits);
  }
}
const mainLegend = makeLegend($("chart"), [
  { key: "candles", name: "Lowest price (candles)", color: "#26a69a", series: [candles], digits: 2 },
  { key: "median", name: "Sales median", color: "#f5a623", series: [median], digits: 2 },
  { key: "volume", name: "Sold", color: "#8a8f98", series: [volume], digits: 0 },
  { key: "ev", name: "EV", color: "#4fc3f7", series: [evLine, evRaw], digits: 2 },
  { key: "mkt", name: "Market index", color: "#9ccc65", series: [mktLine], digits: 1 },
  { key: "drop", name: "Drop pool line", color: "#ef5350", series: [dropLine], digits: 0 },
]);
mainLegend.find(e => e.key === "drop").val.style.display = "none";
const lowLegend = makeLegend($("ratioBox"), [
  { key: "low", name: "Lower panel", color: "#ce93d8", series: [ratioLine], digits: 2 },
]);

const tfs = document.getElementById("tfs");
for (const [label, val] of Object.entries(TFS)) {
  const b = document.createElement("button");
  b.textContent = label; b.dataset.tf = val;
  b.onclick = () => { tf = val; renderTfs(); loadChart(true); };
  tfs.appendChild(b);
}
function renderTfs() { for (const b of tfs.children) b.classList.toggle("on", b.dataset.tf === tf); }
renderTfs();

async function loadItems() {
  const items = await (await fetch("/api/items")).json();
  const list = document.getElementById("list");
  list.innerHTML = "";
  for (const it of items) {
    const chg = it.price_24h ? (it.price / it.price_24h - 1) * 100 : 0;
    const row = document.createElement("div");
    row.className = "row" + (current && current.id === it.id ? " active" : "");
    row.innerHTML = `<img src="${it.icon_url || ""}" alt=""><span class="name"></span>
      <span class="price">$${it.price.toFixed(2)}<br><span class="chg ${chg >= 0 ? "up" : "down"}">${chg >= 0 ? "+" : ""}${chg.toFixed(2)}%</span></span>`;
    row.querySelector(".name").textContent = it.market_hash_name;
    row.onclick = () => { current = it; loadItems(); loadNews().then(() => loadChart(true)); };
    list.appendChild(row);
  }
  if (!current && items.length) { current = items[0]; loadItems(); loadNews().then(() => loadChart(true)); }
}

async function loadChart(fit) {
  if (!current) return;
  document.getElementById("title").textContent = current.market_hash_name;
  const bars = await (await fetch(`/api/candles?item_id=${current.id}&tf=${tf}`)).json();
  candles.setData(bars);
  // Steam sales history is hourly, so the median and volume exist only on 1h and above.
  hist = [];
  if (HOURLY.includes(tf)) hist = await (await fetch(`/api/sales?item_id=${current.id}&tf=${tf}`)).json();
  median.setData(hist.filter(h => h.median !== null).map(h => ({ time: h.time, value: h.median })));
  // Steam keeps only daily sales older than ~30 days: on 1h and 4h such a bar is a whole day of sales,
  // so it is taller than hourly ones. Colored differently to avoid confusion.
  volume.setData(hist.map(h => ({ time: h.time, value: h.volume, color: h.daily ? "#5c4a2a" : "#3a4150" })));
  // EV is daily; on 1h and 4h the line steps by day.
  // Active drop pool: exit date for retired cases, forecast from the average lifetime for active ones.
  const drop = await (await fetch(`/api/drop?item_id=${current.id}`)).json();
  const stepD = { "1": 60, "5": 300, "15": 900, "60": 3600, "240": 14400, "1D": 86400 }[tf];
  const dropDate = drop && (drop.left_active || drop.forecast);
  // The Lightweight Charts time scale is bar-based, not calendar-based: if the date is outside the data (a future
  // forecast or an exit before history starts), fill the gap with empty bars so the line lands on its date.
  const allTimes = [...bars.map(b => b.time), ...hist.map(h => h.time)];
  const t = dropDate ? Math.floor(Date.parse(dropDate + "T00:00:00Z") / 1000 / stepD) * stepD : null;
  const first = Math.min(...allTimes), last = Math.max(...allTimes);
  const gap = t === null || !allTimes.length ? Infinity : Math.max(0, first - t, t - last) / stepD;
  if (gap < 20000) {
    const forecast = !drop.left_active, pts = [];
    for (let x = t; x < first; x += stepD) if (x !== t) pts.push({ time: x });
    for (let x = last + stepD; x < t; x += stepD) pts.push({ time: x });
    pts.push({ time: t, value: 1, color: forecast ? "rgba(239,83,80,0.6)" : "rgba(138,143,152,0.5)" });
    dropLine.setData(pts.sort((a, b) => a.time - b.time));
    dropLine.setMarkers([{ time: t, position: "aboveBar", color: forecast ? "#ef5350" : "#8a8f98", shape: "circle",
      text: forecast ? `forecast: leaves drop pool ${dropDate}` : `left drop pool ${dropDate}` }]);
  } else { dropLine.setData([]); dropLine.setMarkers([]); }
  evData = [];
  if (HOURLY.includes(tf)) evData = await (await fetch(`/api/ev?item_id=${current.id}`)).json();
  // The market index is daily, so like EV it is shown only on 1h and above.
  mktData = HOURLY.includes(tf) ? await (await fetch("/api/market")).json() : [];
  mktLine.setData(mktData.map(d => ({ time: d.time, value: d.value })));
  renderEv();
  // News markers on the chart. A marker time must match a bar time, so it is rounded to the timeframe.
  const step = { "1": 60, "5": 300, "15": 900, "60": 3600, "240": 14400, "1D": 86400 }[tf];
  const target = HOURLY.includes(tf) ? volume : candles;
  (HOURLY.includes(tf) ? candles : volume).setMarkers([]);
  const times = new Set((HOURLY.includes(tf) ? hist : bars).map(b => b.time));
  const marks = [...new Set(newsItems.map(n => Math.floor(n.ts / step) * step))].filter(t => times.has(t));
  target.setMarkers(marks.sort((a, b) => a - b).map(time => ({ time, position: "aboveBar",
    color: "#f5a623", shape: "arrowDown", text: "N" })));
  const dropHint = drop && drop.forecast ? `Red line - forecast exit from the active drop pool: release ${drop.released} + `
    + `${drop.mean_days} days (average lifetime of past regular cases). ` : "";
  document.getElementById("hint").textContent = dropHint + (HOURLY.includes(tf)
    ? (!hist.length ? "No sales history yet: the cloud needs a Steam cookie."
       : hist.some(h => h.daily) ? "Brown bars are whole-day sales: Steam keeps only daily history older than ~30 days." : "")
    : "Sales volume and median are available on 1h, 4h and 1D only.");
  if (fit) {
    // Candles exist only since the collector started, sales history spans years: show the last ~200 bars.
    const last = bars.length ? bars[bars.length - 1].time : (hist.length ? hist[hist.length - 1].time : null);
    if (last) chart.timeScale().setVisibleRange({ from: last - 200 * step, to: last + step });
  }
  syncTimes();
  updateLegend(mainLegend); updateLegend(lowLegend);
}

let newsItems = [];
// The news panel collapses to a narrow strip on the right; the state is remembered in the browser.
const newsPanel = document.getElementById("news"), newsToggle = document.getElementById("newsToggle");
function setNewsCollapsed(c) {
  newsPanel.classList.toggle("collapsed", c);
  newsToggle.textContent = c ? "«" : "»";
  try { localStorage.setItem("newsCollapsed", c ? "1" : "0"); } catch (e) {}
}
newsToggle.onclick = e => { e.stopPropagation(); setNewsCollapsed(!newsPanel.classList.contains("collapsed")); };
newsPanel.onclick = () => { if (newsPanel.classList.contains("collapsed")) setNewsCollapsed(false); };
try { setNewsCollapsed(localStorage.getItem("newsCollapsed") === "1"); } catch (e) {}
// Steam news text comes as BBCode/HTML: keep only the text for the panel.
const plain = t => t.replace(/\{STEAM_CLAN_IMAGE\}\S*/g, "").replace(/\[img\][\s\S]*?\[\/img\]/gi, "")
  .replace(/<img[^>]*>/gi, "").replace(/https?:\/\/\S+\.(png|jpe?g|gif|webp)\S*/gi, "").replace(/\[\/?(p|br|list|olist|\*|h\d)\]/g, "\n")
  .replace(/\[[^\]]*\]/g, "").replace(/<br\s*\/?>/gi, "\n").replace(/<[^>]+>/g, "").replace(/\n{3,}/g, "\n\n").trim();

async function loadNews() {
  if (!current) return;
  newsItems = await (await fetch(`/api/news?item_id=${current.id}`)).json();
  const box = document.getElementById("newsList");
  box.innerHTML = newsItems.length ? "" : '<div class="empty">No news for this case yet.</div>';
  for (const n of newsItems) {
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = '<div class="date"></div><a target="_blank" rel="noopener"></a><div class="text"></div>';
    el.querySelector(".date").textContent = new Date(n.ts * 1000).toLocaleDateString();
    const a = el.querySelector("a"); a.textContent = n.title; if (/^https?:/.test(n.url)) a.href = n.url;
    const txt = el.querySelector(".text"); txt.textContent = plain(n.contents);
    txt.onclick = () => txt.classList.toggle("open");
    box.appendChild(el);
  }
}

async function loadStatus() {
  const s = await (await fetch("/api/status")).json();
  document.getElementById("status").textContent =
    `Snapshots in DB: ${s.ticks}. Latest: ${s.last_ts ? new Date(s.last_ts * 1000).toLocaleString() : "none"}. ` +
    `Sales history points: ${s.sales_points}. Candles - lowest sell price, orange line - median of real sales, bars - units sold.`;
}

loadItems(); loadStatus();
setInterval(() => { loadItems(); loadChart(false); loadStatus(); }, 60000);
</script>
